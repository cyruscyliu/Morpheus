workspace:
  root: ${MORPHEUS_DATA_ROOT}/workspaces/ci
cache:
  root: ${MORPHEUS_DATA_ROOT}/cache
  namespace: ci
  downloads: global
  builds: global
  src: global
tools:
  buildroot:
    seed-dir: ../tools/buildroot/tests/fixtures/minimal-buildroot
    patch-dir: ../tools/buildroot/patches/demo
  linux:
    seed-dir: ../tools/linux/tests/fixtures/minimal-linux-src
    patch-dir: ../tools/linux/patches/demo
  libvmm:
    seed-dir: ../tools/libvmm/tests/fixtures/minimal-libvmm-src
    patch-dir: ../tools/libvmm/patches/demo
    example: virtio
  microkit-sdk:
    seed-dir: ../tools/microkit-sdk/tests/fixtures/minimal-microkit-sdk-src
    patch-dir: ../tools/microkit-sdk/patches/demo
    toolchain-version: fixture
    toolchain-prefix-aarch64: aarch64-none-elf
  llbase:
    mode: local
    target: ./fixtures/llbase/runtime-contract.json
  devilang:
    mode: local
    build-dir-key: fixture
    clang: 15
    artifacts:
      - build-dir
      - output-dir
      - manifest
      - log-file
  nqc2:
    build-version: dev
    build-dir-key: default
  qemu:
    seed-dir: ../tools/qemu/tests/fixtures/minimal-qemu-src
    patch-dir: ../tools/qemu/patches/demo
  libafl:
    seed-dir: ../tools/libafl/tests/fixtures/minimal-libafl-src
    patch-dir: ../tools/libafl/patches/overlay
  nvirsh:
    source: ../tools/nvirsh/profiles/qemu-debian-arm
    profile: qemu-debian-arm64
    build-dir-key: qemu-debian-arm64
    reuse-build-dir: true
    firmware: /usr/share/qemu-efi-aarch64/QEMU_EFI.fd
    dependencies:
      qemu:
        tool: qemu
        artifact: qemu-system-aarch64
      buildroot:
        tool: buildroot
        artifact: output-dir
  sel4:
    seed-dir: ../tools/sel4/tests/fixtures/minimal-sel4-src
    patch-dir: ../tools/sel4/patches/demo
workflows:
  llbase-build-ci:
    category: build
    stages:
      - id: llbase_inspect
        tool: llbase
        command: inspect
        stageId: llbase
        stageName: llbase
        stageIndex: 0
        stageStepIndex: 0
  llbic-build-ci:
    category: build
    stages:
      - id: llbic_inspect
        tool: llbic
        command: inspect
        args:
          - --target
          - ./tools/llbic/tests/fixtures/linux-6.18.16-arm64-clang15/llbic.json
        stageId: llbic
        stageName: llbic
        stageIndex: 0
        stageStepIndex: 0
  llcg-build-ci:
    category: build
    stages:
      - id: llcg_inspect
        tool: llcg
        command: inspect
        args:
          - --target
          - ./tools/llcg/tests/fixtures/minimal-llcg-output/llcg-manifest.json
        stageId: llcg
        stageName: llcg
        stageIndex: 0
        stageStepIndex: 0
  devilang-build-ci:
    category: build
    stages:
      - id: devilang_audit_test
        tool: devilang
        command: test-audit-state
        stageId: devilang-verify
        stageName: devilang-verify
        stageIndex: 0
        stageStepIndex: 0
      - id: devilang_static_checks
        tool: devilang
        command: test-static-checks
        stageId: devilang-verify
        stageName: devilang-verify
        stageIndex: 0
        stageStepIndex: 1
  libafl-build-ci:
    category: build
    stages:
      - id: libafl_fetch
        tool: libafl
        command: fetch
        args:
          - --build-version
          - ffbb151f34d4d486ffc8e24fc105571c4133a149
        stageId: libafl
        stageName: libafl
        stageIndex: 0
        stageStepIndex: 0
      - id: libafl_patch
        tool: libafl
        command: patch
        args:
          - --source
          - "{{steps.libafl_fetch.artifacts.source-dir.location}}"
        stageId: libafl
        stageName: libafl
        stageIndex: 0
        stageStepIndex: 1
  libvmm-build-ci:
    category: build
    stages:
      - id: sel4_fetch
        tool: sel4
        command: fetch
        args:
          - --build-version
          - fixture
        stageId: sel4
        stageName: sel4
        stageIndex: 0
        stageStepIndex: 0
      - id: sel4_patch
        tool: sel4
        command: patch
        args:
          - --path
          - "{{steps.sel4_fetch.artifacts.source-dir.location}}"
        stageId: sel4
        stageName: sel4
        stageIndex: 0
        stageStepIndex: 1
      - id: microkit_sdk_fetch
        tool: microkit-sdk
        command: fetch
        args:
          - --build-version
          - fixture
        stageId: microkit-sdk
        stageName: microkit-sdk
        stageIndex: 1
        stageStepIndex: 0
      - id: microkit_sdk_patch
