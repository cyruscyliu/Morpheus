        stageName: microkit-sdk
        stageIndex: 1
        stageStepIndex: 1
      - id: microkit_sdk_build
        tool: microkit-sdk
        command: build
        args:
          - --path
          - "{{steps.microkit_sdk_patch.artifacts.source-dir.location}}"
          - --sel4
          - "{{steps.sel4_patch.artifacts.source-dir.location}}"
          - --boards
          - qemu_virt_aarch64
          - --configs
          - debug
        stageId: microkit-sdk
        stageName: microkit-sdk
        stageIndex: 1
        stageStepIndex: 2
      - id: libvmm_fetch
        tool: libvmm
        command: fetch
        stageId: libvmm
        stageName: libvmm
        stageIndex: 2
        stageStepIndex: 0
      - id: libvmm_patch
        tool: libvmm
        command: patch
        args:
          - --source
          - "{{steps.libvmm_fetch.artifacts.libvmm-dir.location}}"
        stageId: libvmm
        stageName: libvmm
        stageIndex: 2
        stageStepIndex: 1
      - id: libvmm_build
        tool: libvmm
        command: build
        args:
          - --source
          - "{{steps.libvmm_patch.artifacts.libvmm-dir.location}}"
          - --microkit-sdk
          - "{{steps.microkit_sdk_build.artifacts.sdk-dir.location}}"
          - --toolchain-bin-dir
