workspace:
  root: ${MORPHEUS_DATA_ROOT}/workspaces/root
cache:
  namespace: root
  downloads: global
  builds: global
  src: global
tools:
  buildroot:
    seed-dir: ./tools/buildroot/tests/fixtures/minimal-buildroot
    patch-dir: ./tools/buildroot/patches/demo
  libvmm:
    seed-dir: ./tools/libvmm/tests/fixtures/minimal-libvmm-src
    patch-dir: ./tools/libvmm/patches/demo
    example: virtio
  microkit-sdk:
    seed-dir: ./tools/microkit-sdk/tests/fixtures/minimal-microkit-sdk-src
    patch-dir: ./tools/microkit-sdk/patches/demo
    toolchain-version: fixture
    toolchain-prefix-aarch64: aarch64-none-elf
  llbase:
    mode: local
    source: ./tools/llbase
    build-dir-key: latest
    family: latest
    pull-image: "false"
    build-image: false
    artifacts:
      - source-dir
      - output-dir
      - runtime-helper
      - runtime-contract
  devilang:
    mode: local
    build-dir-key: fixture
    clang: 15
    artifacts:
      - build-dir
      - output-dir
      - manifest
      - log-file
  nqc2:
    build-version: dev
    build-dir-key: default
  qemu:
    seed-dir: ./tools/qemu/tests/fixtures/minimal-qemu-src
    patch-dir: ./tools/qemu/patches/demo
  libafl:
    seed-dir: ./tools/libafl/tests/fixtures/minimal-libafl-src
    patch-dir: ./tools/libafl/patches/overlay
  pkvm-aarch64:
    git-url: https://github.com/vrosendahl/pkvm-aarch64.git
    patch-dir: ./tools/pkvm-aarch64/patches/overlay
  nvirsh:
    source: ./tools/nvirsh/profiles/qemu-debian-arm
    profile: qemu-debian-arm64
    build-dir-key: qemu-debian-arm64
    reuse-build-dir: true
    firmware: /usr/share/qemu-efi-aarch64/QEMU_EFI.fd
    dependencies:
      qemu:
        tool: qemu
        artifact: qemu-system-aarch64
      buildroot:
        tool: buildroot
        artifact: output-dir
  sel4:
    seed-dir: ./tools/sel4/tests/fixtures/minimal-sel4-src
    patch-dir: ./tools/sel4/patches/demo
workflows:
  llbase-build-ci:
    category: build
    stages:
      - id: llbase_build
        tool: llbase
        command: build
        stageId: llbase
        stageName: llbase
        stageIndex: 0
        stageStepIndex: 0
  llbic-build-ci:
    category: build
    stages:
      - id: llbic_inspect
        tool: llbic
        command: inspect
        args:
          - --target
          - ./tools/llbic/tests/fixtures/linux-6.18.16-arm64-clang15/llbic.json
        stageId: llbic
        stageName: llbic
        stageIndex: 0
        stageStepIndex: 0
  llcg-build-ci:
    category: build
    stages:
      - id: llcg_inspect
        tool: llcg
        command: inspect
        args:
          - --target
          - ./tools/llcg/tests/fixtures/minimal-llcg-output/llcg-manifest.json
        stageId: llcg
        stageName: llcg
        stageIndex: 0
        stageStepIndex: 0
  devilang-build-ci:
    category: build
    stages:
      - id: llbase_build
        tool: llbase
        command: build
        stageId: llbase
        stageName: llbase
        stageIndex: 0
        stageStepIndex: 0
      - id: llcg_build
        tool: llcg
        command: build
        args:
          - --llbase-contract
          - "{{steps.llbase_build.artifacts.runtime-contract.location}}"
        stageId: llcg
        stageName: llcg
        stageIndex: 1
        stageStepIndex: 0
      - id: llbic_inspect
        tool: llbic
        command: inspect
        args:
          - --target
          - ./tools/llbic/tests/fixtures/linux-6.18.16-arm64-clang15/llbic.json
        stageId: llbic
        stageName: llbic
        stageIndex: 2
        stageStepIndex: 0
      - id: devilang_build
        tool: devilang
        command: build
        args:
          - --llbase-contract
          - "{{steps.llbase_build.artifacts.runtime-contract.location}}"
          - --llcg-build-dir
          - "{{steps.llcg_build.artifacts.build-dir.location}}"
        stageId: devilang
        stageName: devilang
        stageIndex: 3
        stageStepIndex: 0
      - id: devilang_audit
        tool: devilang
        command: audit-state
        args:
          - --input
          - ./tools/devilang/tests/fixtures/audit-state/pass.state
        stageId: devilang-verify
        stageName: devilang-verify
        stageIndex: 4
        stageStepIndex: 0
      - id: devilang_audit_test
        tool: devilang
        command: test-audit-state
        stageId: devilang-verify
        stageName: devilang-verify
        stageIndex: 4
        stageStepIndex: 1
      - id: devilang_static_checks
        tool: devilang
        command: test-static-checks
        stageId: devilang-verify
        stageName: devilang-verify
        stageIndex: 4
        stageStepIndex: 2
      - id: devilang_phase_models
        tool: devilang
        command: test-phase-models
        args:
          - --build-dir
          - "{{steps.devilang_build.artifacts.build-dir.location}}"
          - --llcg-build-dir
          - "{{steps.llcg_build.artifacts.build-dir.location}}"
        stageId: devilang-verify
        stageName: devilang-verify
        stageIndex: 4
        stageStepIndex: 3
