tools:
  linux:
    seed-dir: ./minimal-linux-src
    patch-dir: ./patches
workflows:
  nvirsh-qemu-arm64-vm-exec:
    category: build
    stages:
      - id: buildroot_fetch
        tool: buildroot
        command: fetch
      - id: buildroot_patch
        tool: buildroot
        command: patch
        args:
          - --source
          - "{{steps.buildroot_fetch.artifacts.source-dir.location}}"
      - id: buildroot_build
        tool: buildroot
        command: build
        args:
          - --source
          - "{{steps.buildroot_patch.artifacts.source-dir.location}}"
          - --defconfig
          - qemu_aarch64_virt_defconfig
      - id: qemu_fetch
        tool: qemu
        command: fetch
      - id: qemu_patch
        tool: qemu
        command: patch
        args:
          - --source
          - "{{steps.qemu_fetch.artifacts.source-dir.location}}"
      - id: qemu_build
        tool: qemu
        command: build
        args:
          - --source
          - "{{steps.qemu_patch.artifacts.source-dir.location}}"
      - id: nvirsh_fetch
        tool: nvirsh
        command: fetch
      - id: nvirsh_build
        tool: nvirsh
        command: build
        args:
          - --qemu
          - "{{steps.qemu_build.artifacts.qemu-system-aarch64.location}}"
          - --buildroot-output-dir
          - "{{steps.buildroot_build.artifacts.output-dir.location}}"
          - --guest-qemu-source
          - "{{steps.qemu_patch.artifacts.source-dir.location}}"
          - --l2-mode
          - vm
      - id: nvirsh_exec
        tool: nvirsh
        command: exec
        args:
          - --phase
          - launch
          - --detach
  nvirsh-qemu-arm64-cvm-exec:
    category: build
    stages:
      - id: buildroot_fetch
        tool: buildroot
        command: fetch
        stageIndex: 0
      - id: buildroot_patch
        tool: buildroot
        command: patch
        args:
          - --source
          - "{{steps.buildroot_fetch.artifacts.source-dir.location}}"
        stageIndex: 0
      - id: buildroot_build
        tool: buildroot
        command: build
        args:
          - --source
          - "{{steps.buildroot_patch.artifacts.source-dir.location}}"
          - --defconfig
          - qemu_aarch64_virt_defconfig
        stageIndex: 0
      - id: linux_fetch
        tool: linux
        command: fetch
        stageIndex: 1
      - id: linux_patch
        tool: linux
        command: patch
        args:
          - --source
          - "{{steps.linux_fetch.artifacts.source-dir.location}}"
        stageIndex: 1
      - id: linux_build
        tool: linux
        command: build
        args:
          - --source
          - "{{steps.linux_patch.artifacts.source-dir.location}}"
          - --defconfig
          - qemu_virt_defconfig
        stageIndex: 1
      - id: qemu_host_fetch
        tool: qemu
        command: fetch
        stageIndex: 2
      - id: qemu_host_build
        tool: qemu
        command: build
        args:
          - --source
          - "{{steps.qemu_host_fetch.artifacts.source-dir.location}}"
          - --build-dir-key
          - qemu-ci-host-fixture
          - --reuse-build-dir
        stageIndex: 2
      - id: nvirsh_build
        tool: nvirsh-buildroot-based-cvm
        command: build
        args:
          - --qemu
          - "{{steps.qemu_host_build.artifacts.qemu-system-aarch64.location}}"
          - --buildroot-output-dir
          - "{{steps.buildroot_build.artifacts.output-dir.location}}"
          - --l1-kernel
          - "{{steps.linux_build.artifacts.images/Image.location}}"
          - --l1-firmware-a
          - ./apps/morpheus/test/fixtures/nvirsh-workflows/SBSA_FLASH0.fd
          - --l1-firmware-b
          - ./apps/morpheus/test/fixtures/nvirsh-workflows/SBSA_FLASH1.fd
          - --l1-machine
          - sbsa-ref
          - --l1-cpu
          - max,x-rme=on,sme=off,pauth-impdef=on,sve=off
          - --l1-cmdline
          - root=/dev/vda console=ttyAMA0
          - --l1-memory-mb
          - "4096"
          - --l1-cpus
          - "1"
          - --build-dir-key
          - qemu-buildroot-based-cvm-smoke
        stageIndex: 3
      - id: nvirsh_inspect
        tool: nvirsh-buildroot-based-cvm
        command: inspect
        args:
          - --build-dir-key
          - qemu-buildroot-based-cvm-smoke
        stageIndex: 4
  nvirsh-qemu-arm64-cvm-dma-mmio-exec:
    category: run
    stages:
      - id: buildroot
        name: buildroot
        steps:
          - id: buildroot_fetch
            tool: buildroot
            command: fetch
          - id: buildroot_patch
            tool: buildroot
            command: patch
            args:
              - --source
              - "{{steps.buildroot_fetch.artifacts.source-dir.location}}"
          - id: buildroot_build
            tool: buildroot
            command: build
            args:
              - --source
              - "{{steps.buildroot_patch.artifacts.source-dir.location}}"
              - --defconfig
              - qemu_aarch64_virt_defconfig
              - --config-fragment
              - BR2_JLEVEL=2
      - id: linux
        name: linux
        steps:
          - id: linux_fetch
            tool: linux
            command: fetch
          - id: linux_build
            tool: linux
            command: build
            args:
              - --source
              - "{{steps.linux_fetch.artifacts.source-dir.location}}"
              - --defconfig
              - qemu_virt_defconfig
      - id: linux-l2
        name: linux-l2
        steps:
          - id: linux_l2_fetch
            tool: linux
            command: fetch
          - id: linux_l2_patch
            tool: linux
            command: patch
            args:
              - --source
              - "{{steps.linux_l2_fetch.artifacts.source-dir.location}}"
              - --patch-dir
              - ./patches/l2-mmio
          - id: linux_l2_build
            tool: linux
            command: build
            args:
              - --source
              - "{{steps.linux_l2_patch.artifacts.source-dir.location}}"
              - --defconfig
              - qemu_virt_defconfig
      - id: qemu-host
        name: qemu-host
        steps:
          - id: qemu_host_fetch
            tool: qemu
            command: fetch
          - id: qemu_host_build
            tool: qemu
            command: build
            args:
              - --source
              - "{{steps.qemu_host_fetch.artifacts.source-dir.location}}"
              - --build-dir-key
              - qemu-ci-host-fixture
              - --reuse-build-dir
      - id: nvirsh
        name: nvirsh
        steps:
          - id: nvirsh_build
            tool: nvirsh-buildroot-based-cvm
            command: build
            args:
              - --build-dir-key
              - qemu-buildroot-based-cvm-dma-mmio-fixture
              - --qemu
              - "{{steps.qemu_host_build.artifacts.qemu-system-aarch64.location}}"
              - --buildroot-output-dir
              - "{{steps.buildroot_build.artifacts.output-dir.location}}"
              - --l2-kernel
              - "{{steps.linux_l2_build.artifacts.images/Image.location}}"
              - --l2-qemu
              - "{{steps.buildroot_build.artifacts.target/usr/bin/qemu-system-aarch64.location}}"
              - --l2-virtio-transport
              - mmio
              - --l1-kernel
              - "{{steps.linux_build.artifacts.images/Image.location}}"
              - --l1-firmware-a
              - ./apps/morpheus/test/fixtures/nvirsh-workflows/SBSA_FLASH0.fd
              - --l1-firmware-b
              - ./apps/morpheus/test/fixtures/nvirsh-workflows/SBSA_FLASH1.fd
              - --l1-machine
              - sbsa-ref
              - --l1-cpu
              - max,x-rme=on,sme=off,pauth-impdef=on,sve=off
              - --l1-cmdline
              - root=/dev/vda console=ttyAMA0
              - --l1-memory-mb
              - "8192"
              - --l1-cpus
              - "8"
      - id: nvirsh-exec
        name: nvirsh-exec
        steps:
          - id: nvirsh_exec
            tool: nvirsh-buildroot-based-cvm
            command: exec
            args:
              - --build-dir-key
              - qemu-buildroot-based-cvm-dma-mmio-fixture
              - --phase
              - launch
